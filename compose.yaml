services:
  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ${PATH_TO_STORAGE}:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
  
  blazorapp:
    image: blazorapp
    ports:
      - "5000:8080"
    build:
      context: .
      dockerfile: BlazorApp/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "app.py" ]
    
  blazorappapi:
    image: blazorappapi
    build:
      context: .
      dockerfile: BlazorAppApi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: [ "python", "app.py" ]
    ports:
      - "5001:8080"
    volumes:
      - dpkeys:/app/keys/
volumes:
  dpkeys: {}